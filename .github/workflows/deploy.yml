name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24 for built-in TypeScript stripping and module.registerHooks (scripts/verify-lessons.mjs)
          node-version: 24
          cache: npm
      # postinstall copies the Stockfish .js/.wasm into public/engine/
      - run: npm ci
      - run: npm test
      # Every lesson position and accepted move, checked with Stockfish and the Lichess tablebase
      - run: npm run verify:lessons
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
