<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Play Stockfish at your level and get a plain-English explanation of every move." />
    <title>Chess Coach</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>" />
  </head>
  <body>
    <header class="topbar">
      <h1>Chess Coach</h1>
      <div class="mode-switch" role="tablist" aria-label="Mode">
        <button type="button" role="tab" id="mode-play" class="mode-tab">Play</button>
        <button type="button" role="tab" id="mode-puzzles" class="mode-tab">Puzzles</button>
        <button type="button" role="tab" id="mode-review" class="mode-tab">Review</button>
        <button type="button" role="tab" id="mode-analysis" class="mode-tab">Best move</button>
        <button type="button" role="tab" id="mode-learn" class="mode-tab">Learn</button>
      </div>
      <div class="engine-box">
        <label class="engine-pick" title="Stockfish build for analysis, reviews, hints and Best move. The bot opponent always uses Lite.">
          <span class="muted small engine-label">Engine</span>
          <select id="engine-build">
            <option value="lite">Lite (1.8 MB)</option>
            <option value="full">Full (99 MB, stronger)</option>
          </select>
        </label>
        <span id="engine-status" class="engine-status" role="status">Loading engine…</span>
      </div>
    </header>

    <main class="layout">
      <section class="board-col" aria-label="Board">
        <div class="board-row">
          <div id="bar-top" class="player-bar"></div>
          <div id="evalbar" class="evalbar" role="meter" aria-label="Evaluation">
            <div class="evalbar-fill"></div>
            <span class="evalbar-label"></span>
          </div>
          <div id="board-host" class="board-host">
            <div id="board" class="board"></div>
          </div>
          <div id="bar-bottom" class="player-bar"></div>
        </div>
        <div id="coach-line" class="coach-line" aria-live="polite" hidden></div>
        <nav class="nav" aria-label="Move navigation">
          <button type="button" class="btn icon" id="nav-first" title="First position (Home)" aria-label="First position">⏮</button>
          <button type="button" class="btn icon" id="nav-prev" title="Previous move (←)" aria-label="Previous move">◀</button>
          <button type="button" class="btn icon" id="nav-next" title="Next move (→)" aria-label="Next move">▶</button>
          <button type="button" class="btn icon" id="nav-last" title="Latest position (End)" aria-label="Latest position">⏭</button>
          <button type="button" class="btn small" id="continue-here" hidden>Continue from here</button>
        </nav>
      </section>

      <aside class="panel">
        <section class="card puzzle-card" id="puzzle-panel" aria-label="Puzzles" hidden></section>
        <section class="card review-mode-card" id="review-panel" aria-label="Review" hidden></section>
        <section class="card analysis-card" id="analysis-panel" aria-label="Best move" hidden></section>
        <section class="card learn-card" id="learn-panel" aria-label="Learn" hidden></section>

        <div id="play-panel" class="panel-stack">
        <section class="card practice-card" id="practice-card" aria-label="Practice" hidden></section>
        <section class="card" aria-label="Game">
          <p id="status" class="status" role="status"></p>
          <p id="game-info" class="muted small"></p>
          <div class="controls play-main">
            <button type="button" class="btn hint-btn" id="btn-hint" title="Hint (H)">Hint</button>
            <button type="button" class="btn" id="btn-takeback">Take back <span id="takeback-count" class="count">0</span></button>
            <button type="button" class="btn primary" id="btn-new">New game</button>
          </div>
          <div class="controls play-more">
            <button type="button" class="btn small" id="btn-flip">Flip board</button>
            <button type="button" class="btn small" id="btn-resign">Resign</button>
            <button type="button" class="btn small" id="btn-pgn">Export PGN</button>
            <button type="button" class="btn small" id="btn-review" title="Available when the game is over">Game review</button>
          </div>
          <div id="hint" class="hint" aria-live="polite" hidden></div>
          <details class="settings">
            <summary>Settings</summary>
            <label class="toggle">
              <input type="checkbox" id="coach-toggle" />
              <span>Show coach and tips during play</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="review-toggle" />
              <span>Offer a game review when the game ends</span>
            </label>
            <div class="appearance">
              <label>
                Board
                <select id="board-theme"></select>
              </label>
              <label>
                Pieces
                <select id="piece-set"></select>
              </label>
            </div>
          </details>
        </section>

        <section class="card review-card" id="review" aria-label="Game review" hidden></section>

        <section class="card explain" id="coach-card" aria-label="Coach" aria-live="polite">
          <h2>Coach</h2>
          <div id="explain"></div>
        </section>

        <section class="card tips" id="tips-card" aria-label="Tips">
          <h2>Tips</h2>
          <div id="tips"></div>
        </section>

        <section class="card moves-card" id="moves-card" aria-label="Moves">
          <h2>Moves</h2>
          <div id="moves" class="moves"></div>
        </section>
        </div>
      </aside>
    </main>

    <dialog id="new-game-dialog" aria-labelledby="ng-title">
      <form method="dialog" class="dialog-form">
        <h2 id="ng-title">New game</h2>
        <label class="field">
          <span>Coach strength: <strong id="elo-out">1200</strong> <span id="elo-desc" class="muted"></span></span>
          <input type="range" id="elo" min="400" max="2500" step="100" value="1200" />
        </label>
        <fieldset class="field">
          <legend>You play</legend>
          <label><input type="radio" name="color" value="w" checked /> White</label>
          <label><input type="radio" name="color" value="b" /> Black</label>
          <label><input type="radio" name="color" value="random" /> Random</label>
        </fieldset>
        <div class="dialog-actions">
          <button type="submit" value="cancel" class="btn" id="ng-cancel">Cancel</button>
          <button type="submit" value="start" class="btn primary">Start</button>
        </div>
      </form>
    </dialog>

    <dialog id="review-prompt" aria-labelledby="rp-title">
      <form method="dialog" class="dialog-form">
        <h2 id="rp-title">Game over</h2>
        <p id="rp-result" class="status"></p>
        <p id="rp-text"></p>
        <div class="dialog-actions">
          <button type="submit" value="cancel" class="btn">Not now</button>
          <button type="submit" value="summary" class="btn">Just the summary</button>
          <button type="submit" value="key" class="btn">Jump to key moments</button>
          <button type="submit" value="walk" class="btn primary">Go through it move by move</button>
        </div>
      </form>
    </dialog>

    <dialog id="practice-dialog" aria-labelledby="pd-title">
      <form method="dialog" class="dialog-form">
        <h2 id="pd-title">Play from here</h2>
        <p id="pd-where" class="muted small"></p>
        <fieldset class="field">
          <legend>Play as</legend>
          <label><input type="radio" name="pd-side" value="mover" checked /> <span id="pd-mover"></span></label>
          <label><input type="radio" name="pd-side" value="other" /> <span id="pd-other"></span></label>
        </fieldset>
        <label class="field">
          <span>Coach strength: <strong id="pd-elo-out">1200</strong></span>
          <input type="range" id="pd-elo" min="400" max="2500" step="100" value="1200" />
        </label>
        <label class="field">
          <span>Goal</span>
          <select id="pd-goal">
            <option value="convert">Convert the win</option>
            <option value="hold">Hold the draw</option>
            <option value="win">Win from here</option>
            <option value="free">Free play</option>
          </select>
          <span id="pd-goal-why" class="muted small"></span>
        </label>
        <div class="dialog-actions">
          <button type="submit" value="cancel" class="btn">Cancel</button>
          <button type="submit" value="start" class="btn primary">Start</button>
        </div>
      </form>
    </dialog>

    <dialog id="confirm-dialog">
      <form method="dialog" class="dialog-form">
        <p id="confirm-text"></p>
        <div class="dialog-actions">
          <button type="submit" value="cancel" class="btn">Cancel</button>
          <button type="submit" value="ok" class="btn primary" id="confirm-ok">OK</button>
        </div>
      </form>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
